name: Release & Packaging

# Builds and packages the application on version tags.
# Satisfies OpenSSF Scorecard "Packaging" check (automated packaging workflow).

permissions: read-all

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  package:
    name: Build package artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aetheria/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./aetheria

      - name: Run tests
        run: npm test
        working-directory: ./aetheria

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        working-directory: ./aetheria

      - name: Build Docker image (packaging)
        # Tolerated: the Next.js build still needs runtime env at page-data
        # collection time (same as security-scan docker job).
        run: docker build -t aetheria:${{ github.ref_name }} ./aetheria
        continue-on-error: true

      - name: Package source artifact
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.next \
              -czf aetheria-${{ github.ref_name }}.tar.gz \
              README.md LICENSE SECURITY.md CHANGELOG.md aetheria/package.json aetheria/package-lock.json aetheria/Dockerfile aetheria/prisma aetheria/src

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aetheria-${{ github.ref_name }}
          path: aetheria-${{ github.ref_name }}.tar.gz
