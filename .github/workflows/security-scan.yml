name: Security Scan

# Default: no token privileges. Jobs that need more declare it explicitly.
permissions: read-all

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  unit-tests:
    name: Unit Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aetheria/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./aetheria

      - name: Run tests
        run: npm test
        working-directory: ./aetheria

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        working-directory: ./aetheria

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aetheria/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./aetheria

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        working-directory: ./aetheria
        continue-on-error: true

      - name: Generate audit report
        run: npm audit --json > audit-report.json
        working-directory: ./aetheria
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report
          path: aetheria/audit-report.json

  code-scan:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    # CodeQL requires GitHub Advanced Security on PRIVATE repos — it runs fully
    # once the repo is public or GHAS is enabled. Don't fail CI until then.
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@47be0dbd5113ab1b79fe2dd3f68bdf7e426cdc87 # v3
        with:
          languages: javascript, typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@47be0dbd5113ab1b79fe2dd3f68bdf7e426cdc87 # v3

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@f9c8139aaeb093242d37ebe137cc5db083fbcc7d # main
        with:
          path: ./
          extra_args: --only-verified

  docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    # The Next.js build currently needs runtime env (DB/billing) at page-data
    # collection time, so the image build fails in CI. Tolerated until the
    # build is made env-free; Trivy still runs whenever the build succeeds.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space
        # Trivy exports the image to /tmp during analysis; the stock runner
        # fills up. Drop the big preinstalled toolchains we don't use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h / /tmp

      - name: Build Docker image
        run: docker build -t aetheria:test ./aetheria

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: 'aetheria:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results as artifact
        # upload-sarif needs GHAS code scanning (unavailable on private repos)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore

  lint-security:
    name: ESLint Security Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aetheria/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./aetheria

      - name: Run ESLint with security plugin
        run: npx eslint . --ext .ts,.tsx --max-warnings 0
        working-directory: ./aetheria
        continue-on-error: true

  security-headers:
    name: Security Headers Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check security headers configuration
        run: |
          echo "Checking proxy.ts for security headers..."
          for header in Content-Security-Policy X-Frame-Options Strict-Transport-Security; do
            grep -q "$header" aetheria/src/proxy.ts && echo "✅ $header configured" || { echo "❌ $header missing"; exit 1; }
          done

  eatheria-scan:
    name: EATHERIA Platform Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trigger EATHERIA scan
        env:
          EATHERIA_API_KEY: ${{ secrets.EATHERIA_API_KEY }}
        run: |
          # Cloudflare's managed challenge blocks non-browser API clients, so
          # resolve the origin (nadro.dev -> droplet) and connect directly.
          ORIGIN_IP=$(dig +short nadro.dev A | head -1)
          echo "Origin: $ORIGIN_IP"
          # Package the source so the scan has real content to analyze
          zip -qr /tmp/src.zip . -x '.git/*' '*/node_modules/*' '*/.next/*' '*/dist/*'
          base64 -w0 /tmp/src.zip > /tmp/code.b64
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --rawfile code /tmp/code.b64 \
            '{repository: $repo, branch: $branch, commit: $commit, scanTypes: ["sast", "sca"], code: $code}' \
            > /tmp/payload.json
          SCAN_RESULT=$(curl -sS -X POST https://eatheria.com/api/v1/scan \
            --resolve eatheria.com:443:$ORIGIN_IP \
            -H "Authorization: Bearer $EATHERIA_API_KEY" \
            -H "Content-Type: application/json" \
            --data @/tmp/payload.json)
          echo "$SCAN_RESULT" | jq 'del(.code)'

  audit-summary:
    name: Security Audit Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, dependency-scan, code-scan, secret-scan, docker-scan, lint-security, eatheria-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Analysis | ${{ needs.code-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Scan | ${{ needs.docker-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint Security | ${{ needs.lint-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EATHERIA Platform Scan | ${{ needs.eatheria-scan.result }} |" >> $GITHUB_STEP_SUMMARY
