name: "AETHERIA Security Scan"
description: "Run AETHERIA security analysis on your code (SAST, SCA, DAST) with AI-powered fixes"
author: "AETHERIA Security"

branding:
  icon: "shield"
  color: "blue"

inputs:
  api-key:
    description: "AETHERIA API key (aeth_xxx). Get one from Settings > API Keys in your dashboard."
    required: true
  api-url:
    description: "AETHERIA API URL"
    required: false
    default: "https://aetheria.ikharoz.me"
  scan-types:
    description: "Comma-separated scan types: sast,sca,dast"
    required: false
    default: "sast,sca"
  fail-on:
    description: "Fail the action if vulnerabilities of this severity or higher are found: critical, high, medium, low, none"
    required: false
    default: "critical"
  comment-on-pr:
    description: "Post results as PR comment (true/false)"
    required: false
    default: "true"
  create-fix-pr:
    description: "Create a PR with AI-suggested fixes (true/false)"
    required: false
    default: "false"
  pdf-report:
    description: "Download detailed PDF report (true/false). Upload it with actions/upload-artifact."
    required: false
    default: "true"

outputs:
  scan-id:
    description: "The AETHERIA analysis ID"
  total-issues:
    description: "Total vulnerabilities found"
  critical-count:
    description: "Critical severity count"
  high-count:
    description: "High severity count"
  status:
    description: "Scan status (COMPLETED, FAILED, etc.)"
  report-path:
    description: "Path to the downloaded PDF report (aetheria-security-report.pdf)"
  fix-pr-url:
    description: "URL of the created fix PR (when create-fix-pr=true)"

runs:
  using: "composite"
  steps:
    - name: Run AETHERIA Scan
      shell: bash
      env:
        AETHERIA_API_KEY: ${{ inputs.api-key }}
        AETHERIA_API_URL: ${{ inputs.api-url }}
        SCAN_TYPES: ${{ inputs.scan-types }}
        FAIL_ON: ${{ inputs.fail-on }}
        COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        CREATE_FIX_PR: ${{ inputs.create-fix-pr }}
        PDF_REPORT: ${{ inputs.pdf-report }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        bash ${{ github.action_path }}/entrypoint.sh
